# Default configuration for Stage 0+1
model: tomg-group-umd/huginn-0125
num_steps: 32
device: cuda
dtype: bfloat16

# Seeds for reproducibility
seeds: [42, 123, 456]

# Convergence thresholds (initial; document any changes in NOTES.md)
residual_threshold: 0.01
kl_delta_values: [0.001, 0.01, 0.05]

# Data
eval_texts_file: null  # if null, use built-in eval texts
max_eval_sequences: 50

# Stage 1 specific
compare_n64: true  # also run at N=64 to check if s_N is still moving

# Statistical
bootstrap_samples: 1000
confidence_level: 0.95
